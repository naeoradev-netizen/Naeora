<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Naéora — Onboarding Slide 3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#14123a;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;}
  .stage{position:relative;width:100%;height:100vh;background:#14123a;overflow:hidden;}
  .bg{position:absolute;top:0;left:0;width:100%;height:42%;object-fit:cover;object-position:top;}
  .overlay{position:absolute;top:0;left:0;width:100%;height:42%;background:linear-gradient(to bottom, transparent 60%, #14123a 100%);}

  .medallion{
    position:absolute;
    top:42%;
    left:50%;
    transform:translate(-50%,-50%);
    width:64px;height:64px;
    border-radius:50%;
    background:#1c1a4a;
    box-shadow:0 0 18px rgba(217,176,111,0.35);
    display:flex;align-items:center;justify-content:center;
    z-index:3;
  }
  .medallion svg{width:30px;height:30px;}

  .content{
    position:absolute;
    top:46%;
    left:0;right:0;
    bottom:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 9vw;
    text-align:center;
    z-index:3;
  }
  .title{
    font-family:Georgia,'Times New Roman',serif;
    font-size:1.6rem;
    color:#f7f2e9;
    margin-bottom:18px;
    margin-top:7vh;
  }
  .text{
    font-size:0.98rem;
    line-height:1.65;
    color:#cfc9e6;
    max-width:380px;
  }

  .dots{
    position:absolute;
    bottom:6vh;
    left:0;right:0;
    display:flex;
    justify-content:center;
    gap:8px;
    z-index:3;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.25);}
  .dot.active{background:#d9b06f;width:18px;border-radius:4px;}

  .tap-zone{position:absolute;inset:0;z-index:10;cursor:pointer;}
</style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="slide3.webp" alt="">
    <div class="overlay"></div>

    <div class="medallion">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d9b06f" stroke-width="1.3">
        <circle cx="12" cy="16" r="4.5"/>
        <path d="M12 6.5v2M12 23.5v0M5 16h-1M20 16h-1M6.8 10.8l-1-1M17.2 10.8l1-1" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="content">
      <div class="title">Le matin</div>
      <div class="text">Chaque matin, une phrase à ancrer en toi.<br>Un instant court, mais puissant, pour ouvrir le champ des possibles avant de débuter ta journée.</div>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="tap-zone" onclick="naeoraNav('onb4')"></div>
  </div>
<script>function naeoraNav(route){ window.parent.postMessage({naeoraNav:route}, "*"); }</script>
<script>
  (function(){
    var startX = 0, startY = 0;
    document.addEventListener('touchstart', function(e){
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive: true});
    document.addEventListener('touchend', function(e){
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
        if(dx < 0) naeoraNav('onb4');
      }
    });
  })();
</script>
</body>
</html>
