<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Naéora — Inscription</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#14123a;
    overflow-y:auto;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .stage{
    position:relative;
    min-height:100vh;
    width:100%;
    background:
      radial-gradient(circle at 50% 0%, rgba(60,40,110,0.5) 0%, transparent 45%),
      #14123a;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8vh 8vw 6vh;
  }

  .stars{
    position:absolute;inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 8%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 30% 4%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 75% 5%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 90% 12%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 18% 16%, rgba(255,255,255,0.3), transparent);
    pointer-events:none;
  }

  .emblem{
    width:52px;height:52px;
    margin-bottom:18px;
    position:relative;z-index:2;
  }

  .title{
    font-family:Georgia,'Times New Roman',serif;
    font-size:1.7rem;
    color:#f7f2e9;
    margin-bottom:8px;
    position:relative;z-index:2;
    text-align:center;
  }
  .subtitle{
    font-size:0.9rem;
    color:#a89fc4;
    margin-bottom:5vh;
    text-align:center;
    position:relative;z-index:2;
  }

  form{
    width:100%;
    max-width:380px;
    position:relative;z-index:2;
  }

  .field{
    margin-bottom:20px;
  }
  .field label{
    display:block;
    font-size:0.78rem;
    letter-spacing:0.06em;
    color:#cfc9e6;
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .field input{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid rgba(217,176,111,0.3);
    background:rgba(255,255,255,0.04);
    color:#f7f2e9;
    font-size:0.98rem;
    font-family:inherit;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .field input::placeholder{
    color:#6c6593;
  }
  .field input:focus{
    outline:none;
    border-color:#d9b06f;
    box-shadow:0 0 0 3px rgba(217,176,111,0.15);
  }
  .field input[type="date"]{
    color-scheme:dark;
  }

  .checkbox-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin:8px 0 32px;
  }
  .checkbox-row input[type="checkbox"]{
    margin-top:3px;
    width:17px;height:17px;
    accent-color:#d9b06f;
    flex-shrink:0;
    cursor:pointer;
  }
  .checkbox-row label{
    font-size:0.84rem;
    line-height:1.5;
    color:#cfc9e6;
  }
  .checkbox-row a{
    color:#d9b06f;
    text-decoration:underline;
  }

  .submit-btn{
    width:100%;
    padding:16px;
    border-radius:30px;
    border:none;
    background:linear-gradient(135deg, #e8c889, #c9963f);
    color:#1c1638;
    font-size:0.92rem;
    font-weight:600;
    letter-spacing:0.04em;
    cursor:pointer;
    font-family:inherit;
    transition:filter 0.25s ease, box-shadow 0.25s ease;
  }
  .submit-btn:hover{
    filter:brightness(1.06);
    box-shadow:0 0 22px rgba(217,176,111,0.35);
  }

  .login-link{
    text-align:center;
    margin-top:24px;
    font-size:0.86rem;
    color:#a89fc4;
    position:relative;z-index:2;
  }
  .login-link a{
    color:#d9b06f;
    text-decoration:none;
  }

  .password-wrap{
    position:relative;
  }
  .password-wrap input{
    padding-right:46px;
  }
  .toggle-password{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    padding:4px;
    cursor:pointer;
    color:#a89fc4;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .toggle-password:hover{
    color:#d9b06f;
  }
  .toggle-password svg{
    width:19px;height:19px;
  }

  .success-block{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:380px;
    position:relative;z-index:2;
  }
  .success-icon{
    font-size:1.8rem;
    color:#d9b06f;
    margin-bottom:1.4rem;
  }
  .success-text{
    font-family:Georgia,'Times New Roman',serif;
    font-size:1.05rem;
    color:#f7f2e9;
    line-height:1.7;
    margin-bottom:1rem;
  }
  .success-subtext{
    font-size:0.84rem;
    color:#a89fc4;
    line-height:1.6;
  }
</style>
</head>
<body>
<script src="naeora-supabase.js"></script>
  <div class="stage">
    <div class="stars"></div>

    <svg class="emblem" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff3da"/>
          <stop offset="50%" stop-color="#f3d9a8"/>
          <stop offset="100%" stop-color="#d9b06f"/>
        </linearGradient>
      </defs>
      <path d="M 50 12 A 38 38 0 1 0 50 88 A 30 30 0 1 1 50 12 Z" fill="url(#goldGrad)"/>
      <g transform="translate(50,46)">
        <path d="M0,-26 L4,-5 L26,0 L4,5 L0,26 L-4,5 L-26,0 L-4,-5 Z" fill="url(#goldGrad)"/>
        <path d="M0,-17 L2.5,-3 L17,0 L2.5,3 L0,17 L-2.5,3 L-17,0 L-2.5,-3 Z" fill="#fff7e6" transform="rotate(45)"/>
      </g>
    </svg>

    <div class="title">Crée ton espace</div>
    <div class="subtitle">Quelques informations pour commencer</div>

    <form id="inscriptionForm" onsubmit="return handleInscription(event)">
      <div class="field">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" placeholder="Ton prénom" required>
      </div>

      <div class="field">
        <label for="naissance">Date de naissance</label>
        <input type="date" id="naissance" required>
      </div>

      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="toi@exemple.com" required>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="8 caractères minimum" required minlength="8">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Afficher le mot de passe">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="cgu" required>
        <label for="cgu">J'accepte les <a href="naeora-cgu.html" target="_blank">conditions d'utilisation</a> et la <a href="naeora-confidentialite.html" target="_blank">politique de confidentialité</a></label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Créer mon compte</button>
    </form>

    <div class="success-block" id="successBlock">
      <div class="success-icon">✦</div>
      <div class="success-text">Vérifie ta boîte mail</div>
      <div class="success-subtext">Nous venons de t'envoyer un lien de confirmation. Clique dessus pour activer ton compte, puis reviens te connecter ici.</div>
    </div>

    <div class="login-link" id="loginLink">Déjà un compte ? <a href="#" onclick="naeoraNav('connexion'); return false;">Se connecter</a></div>
  </div>
<script>function naeoraNav(route){ window.parent.postMessage({naeoraNav:route}, "*"); }</script>
<script>
  // Limite la date de naissance sélectionnable à 18 ans minimum
  (function(){
    var champ = document.getElementById('naissance');
    var limite = new Date();
    limite.setFullYear(limite.getFullYear() - 18);
    champ.max = limite.toISOString().split('T')[0];
  })();

  async function handleInscription(event){
    event.preventDefault();
    var prenom = document.getElementById('prenom').value.trim();
    var naissance = document.getElementById('naissance').value;
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    var limite = new Date();
    limite.setFullYear(limite.getFullYear() - 18);
    if(new Date(naissance) > limite){
      showInscriptionError("Il faut avoir au moins 18 ans pour créer un compte Naéora.");
      return false;
    }

    var btn = document.getElementById('submitBtn');
    btn.textContent = 'Création en cours...';
    btn.disabled = true;

    try {
      var result = await supabase.signUp(email, password, prenom, naissance);
      if(result.error){
        var msg = result.error.message || 'Une erreur est survenue.';
        if(msg.includes('already registered')) msg = 'Cette adresse e-mail est déjà utilisée. Connecte-toi plutôt.';
        showInscriptionError(msg);
        btn.textContent = 'Créer mon compte';
        btn.disabled = false;
        return false;
      }
      // Si aucune session n'est créée, la confirmation par email est requise :
      // on affiche l'écran "vérifie ta boîte mail" au lieu de naviguer vers l'accueil.
      if(!result.access_token){
        document.getElementById('inscriptionForm').style.display = 'none';
        document.getElementById('loginLink').style.display = 'none';
        document.getElementById('successBlock').style.display = 'flex';
        return false;
      }
      // Enregistrer le vrai prénom dans Supabase (pas seulement en local)
      try {
        await supabase.updateProfile({ prenom: prenom, date_naissance: naissance });
      } catch(e){}
      // Sauvegarder le profil en cache
      var profil = { prenom: prenom, email: email, date_naissance: naissance, is_subscriber: false };
      localStorage.setItem('naeora_profile', JSON.stringify(profil));
      naeoraNav('accueil');
    } catch(e) {
      showInscriptionError('Connexion impossible. Vérifiez votre connexion internet.');
      btn.textContent = 'Créer mon compte';
      btn.disabled = false;
    }
    return false;
  }

  document.getElementById('togglePassword').addEventListener('click', function(){
    var input = document.getElementById('password');
    var isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    this.setAttribute('aria-label', isHidden ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    document.getElementById('eyeIcon').innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  });

  function showInscriptionError(msg){
    var existing = document.getElementById('inscriptionError');
    if(existing) existing.remove();
    var div = document.createElement('div');
    div.id = 'inscriptionError';
    div.style.cssText = 'color:#e8a7a7;font-size:0.84rem;margin-top:12px;text-align:center;padding:10px;background:rgba(217,100,100,0.1);border-radius:8px;';
    div.textContent = msg;
    document.getElementById('submitBtn').after(div);
  }
</script>
</body>
</html>
