<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Naéora — Onboarding Slide 1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#14123a;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;}
  .stage{position:relative;width:100%;height:100vh;background:#14123a;overflow:hidden;}
  .bg{position:absolute;top:0;left:0;width:100%;height:42%;object-fit:cover;object-position:top;}
  .overlay{position:absolute;top:0;left:0;width:100%;height:42%;background:linear-gradient(to bottom, transparent 60%, #14123a 100%);}

  .medallion{
    position:absolute;
    top:42%;
    left:50%;
    transform:translate(-50%,-50%);
    width:64px;height:64px;
    border-radius:50%;
    background:#1c1a4a;
    box-shadow:0 0 18px rgba(217,176,111,0.35);
    display:flex;align-items:center;justify-content:center;
    z-index:3;
  }
  .medallion svg{width:30px;height:30px;}

  .content{
    position:absolute;
    top:46%;
    left:0;right:0;
    bottom:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 9vw;
    text-align:center;
    z-index:3;
  }
  .title{
    font-family:Georgia,'Times New Roman',serif;
    font-size:1.6rem;
    color:#f7f2e9;
    margin-bottom:18px;
    margin-top:7vh;
  }
  .text{
    font-size:0.98rem;
    line-height:1.65;
    color:#cfc9e6;
    max-width:380px;
  }

  .dots{
    position:absolute;
    bottom:6vh;
    left:0;right:0;
    display:flex;
    justify-content:center;
    gap:8px;
    z-index:3;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.25);}
  .dot.active{background:#d9b06f;width:18px;border-radius:4px;transition:all 0.3s ease;}

  .tap-zone{position:absolute;inset:0;z-index:2;cursor:pointer;}
</style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="slide1.webp" alt="">
    <div class="overlay"></div>

    <div class="medallion">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d9b06f" stroke-width="1.3">
        <path d="M7 21V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v16"/>
        <path d="M7 21h9"/>
        <circle cx="13.2" cy="12" r="0.6" fill="#d9b06f"/>
      </svg>
    </div>

    <div class="content">
      <div class="title">L'intention</div>
      <div class="text">Naéora n'est pas une application comme les autres.<br>C'est un espace pour te reconnecter à toi-même, chaque jour, à ton rythme.</div>
    </div>

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="tap-zone" onclick="naeoraNav('onb2')"></div>
  </div>
<script>function naeoraNav(route){ window.parent.postMessage({naeoraNav:route}, "*"); }</script></body>
</html>
