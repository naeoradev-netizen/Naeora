<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Naéora — Écran d'ouverture</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#05060f;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#05060f;
  }
  .splash-img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    opacity:0;
    transform:scale(1.04);
    animation:reveal 2.2s ease-out forwards;
  }
  @keyframes reveal{
    0%{ opacity:0; transform:scale(1.04); }
    100%{ opacity:1; transform:scale(1); }
  }

  /* léger effet de respiration continue sur la lumière, très subtil */
  .glow-pulse{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 78%, rgba(255,210,140,0.10) 0%, transparent 35%);
    animation:pulse 7s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.6; }
    50%{ opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .splash-img{ animation:none; opacity:1; transform:none; }
    .glow-pulse{ animation:none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="splash-img" src="assets/splash.webp" alt="Naéora — Ouvrir un nouveau champ des possibles">
    <div class="glow-pulse"></div>
  </div>
</body>
</html>
