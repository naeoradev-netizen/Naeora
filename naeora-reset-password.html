<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naéora — Nouveau mot de passe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#0a0820;overflow-y:auto;font-family:'Jost',sans-serif;}
  .stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 8vw 5vh;}
  .logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2rem;color:#f7f2e9;margin-bottom:0.4rem;text-align:center;}
  .logo-sub{font-size:0.78rem;letter-spacing:0.12em;color:#a89fc4;text-align:center;margin-bottom:5vh;}
  .form-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4rem;color:#f7f2e9;margin-bottom:0.4rem;text-align:center;}
  .form-sub{font-size:0.82rem;color:#a89fc4;margin-bottom:4vh;text-align:center;max-width:340px;line-height:1.6;}
  .field-group{margin-bottom:1.4rem;width:100%;max-width:380px;}
  .field-label{display:block;font-size:0.72rem;letter-spacing:0.06em;color:#8b84ab;text-transform:uppercase;margin-bottom:8px;}
  .field-input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(217,176,111,0.3);background:rgba(255,255,255,0.04);color:#f7f2e9;font-family:inherit;font-size:0.92rem;}
  .field-input:focus{outline:none;border-color:#d9b06f;}
  .submit-btn{width:100%;max-width:380px;padding:14px;border-radius:30px;border:1px solid #d9b06f;background:rgba(217,176,111,0.14);color:#f7f2e9;font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;margin-top:0.5rem;}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .error-msg{margin-top:1rem;padding:10px 14px;border-radius:10px;background:rgba(217,100,100,0.1);border:1px solid rgba(217,100,100,0.3);color:#e8a7a7;font-size:0.82rem;text-align:center;max-width:380px;display:none;}
  .success-block{display:none;flex-direction:column;align-items:center;text-align:center;max-width:380px;}
  .success-icon{font-size:1.8rem;color:#d9b06f;margin-bottom:1.4rem;}
  .success-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:#f7f2e9;line-height:1.7;margin-bottom:2.5rem;}
  .goto-btn{padding:13px 30px;border-radius:30px;border:1px solid #d9b06f;background:rgba(217,176,111,0.12);color:#f7f2e9;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.92rem;cursor:pointer;text-decoration:none;}
</style>
</head>
<body>
<script src="naeora-supabase.js"></script>
<div class="stage">
  <div class="logo">Naéora</div>
  <div class="logo-sub">Retrouve-toi, chaque jour.</div>

  <div id="formBlock" style="display:none;">
    <div class="form-title">Nouveau mot de passe</div>
    <div class="form-sub">Choisis un nouveau mot de passe pour ton espace Naéora.</div>

    <div class="field-group">
      <label class="field-label">Nouveau mot de passe</label>
      <input type="password" id="password" class="field-input" placeholder="••••••••" required>
    </div>
    <div class="field-group">
      <label class="field-label">Confirme le mot de passe</label>
      <input type="password" id="passwordConfirm" class="field-input" placeholder="••••••••" required>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="handleUpdate()">Enregistrer</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="success-block" id="successBlock">
    <div class="success-icon">✦</div>
    <div class="success-text" id="successText">Ton mot de passe a bien été mis à jour.</div>
    <a class="goto-btn" href="naeora-app.html">Retour à l'application</a>
  </div>
</div>

<script>
  var accessToken = null;

  (function(){
    // Le lien envoyé par e-mail contient les infos dans le fragment d'URL (#...)
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);
    accessToken = params.get('access_token');
    var type = params.get('type');

    if(!accessToken || type !== 'recovery'){
      document.getElementById('successBlock').style.display = 'flex';
      document.getElementById('successText').innerHTML = 'Ce lien de réinitialisation n\u2019est plus valide.<br>Demande un nouveau lien depuis l\u2019application.';
      return;
    }
    document.getElementById('formBlock').style.display = 'block';
  })();

  async function handleUpdate(){
    var password = document.getElementById('password').value;
    var passwordConfirm = document.getElementById('passwordConfirm').value;
    if(!password || password.length < 6){ showError('Le mot de passe doit contenir au moins 6 caractères.'); return; }
    if(password !== passwordConfirm){ showError('Les deux mots de passe ne correspondent pas.'); return; }

    var btn = document.getElementById('submitBtn');
    btn.textContent = 'Enregistrement...';
    btn.disabled = true;
    hideError();

    try {
      var result = await supabase.updatePasswordWithToken(accessToken, password);
      if(result.error){
        showError('Impossible de mettre à jour le mot de passe. Réessaie.');
        btn.textContent = 'Enregistrer';
        btn.disabled = false;
        return;
      }
      document.getElementById('formBlock').style.display = 'none';
      document.getElementById('successText').textContent = 'Ton mot de passe a bien été mis à jour.';
      document.getElementById('successBlock').style.display = 'flex';
    } catch(e){
      showError('Connexion impossible. Vérifiez votre connexion internet.');
      btn.textContent = 'Enregistrer';
      btn.disabled = false;
    }
  }

  function showError(msg){
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideError(){
    document.getElementById('errorMsg').style.display = 'none';
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter') handleUpdate();
  });
</script>
</body>
</html>
